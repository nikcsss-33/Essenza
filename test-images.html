<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Imágenes - Essenza</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            font-family: 'Montserrat', sans-serif;
            color: white;
        }
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
            background: #2a2a2a;
            padding: 40px;
            border-radius: 10px;
        }
        h1 {
            color: #b47532;
            text-align: center;
            font-family: 'Elephant', serif;
            font-size: 3rem;
            margin-bottom: 20px;
        }
        .status {
            color: #4CAF50;
            text-align: center;
            margin: 20px 0;
            font-size: 1.2rem;
        }
        .images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .image-box {
            background: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .image-box img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            border-radius: 4px;
        }
        .image-box p {
            margin: 10px 0 0 0;
            color: #333;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .back-link {
            display: inline-block;
            margin-top: 40px;
            padding: 15px 30px;
            background: linear-gradient(135deg, #790000 0%, #b47532 100%);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: transform 0.3s ease;
        }
        .back-link:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Test de Imágenes SVG - Essenza</h1>
        <p class="status">Si ves las imágenes abajo, los archivos SVG están funcionando correctamente</p>

        <div class="images-grid">
            <div class="image-box">
                <p>Perfume SVG</p>
            </div>
            <div class="image-box">
                <p>Loción SVG</p>
            </div>
            <div class="image-box">
                <p>Maquillaje SVG</p>
            </div>
            <div class="image-box">
                <p>Cuidado de la Piel SVG</p>
            </div>
        </div>

        <div style="text-align: center;">
            <a href="index.html" class="back-link">
                Ir al Sitio Principal con Efecto 3D
            </a>
        </div>
    </div>
</body>
</html>
