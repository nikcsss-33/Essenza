<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preview Etiquetas - Essenza</title>
<link rel="stylesheet" href="styles.css">
<style>
body{background:#F7F4EF;font-family:var(--font-primary);padding:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
.card{background:white;padding:18px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,0.06);text-align:center}
.card img{max-width:100%;height:auto;border-radius:6px}
.caption{margin-top:12px;color:var(--color-oscuro)}
</style>
</head>
<body>
<h1 class="section-title">Vista previa: etiquetas generadas</h1>
<p class="section-subtitle">Si no ves imágenes, copia tus archivos a <code>assets/inputs/</code> y ejecuta el script.</p>
<div class="grid">
  <div class="card">
    <img src="assets/generated/rosa_labelled.jpg" alt="Rosa di Milano">
    <div class="caption">Rosa di Milano — Signature</div>
  </div>
  <div class="card">
    <img src="assets/generated/ambra_labelled.jpg" alt="Ambra Veneziana">
    <div class="caption">Ambra Veneziana — Noches de Serenidad</div>
  </div>
  <div class="card">
    <img src="assets/generated/fiori_labelled.jpg" alt="Fiori di Toscana">
    <div class="caption">Fiori di Toscana — Fresco Mediterráneo</div>
  </div>
</div>
</body>
</html>
